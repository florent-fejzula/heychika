# Firebase App Hosting settings (README → Going live).

runConfig:
  # Nobody waiting = nothing running = nothing to pay. The first visitor after a
  # quiet spell waits a second or two longer.
  minInstances: 0
  # One instance serves many visitors at once; two is plenty for this shop and
  # caps the bill if something (or someone) floods it.
  maxInstances: 2

env:
  # The addresses the server answers (Angular's protection against server-side
  # request forgery); anything else gets a 400. Firebase hands requests to the
  # server under Cloud Run's own address (the run.app one), so that must be here
  # too, or every page fails. Add the shop's own domain when it has one.
  - variable: NG_ALLOWED_HOSTS
    value: heychika--heychika-45afb.europe-west4.hosted.app,heychika-241520649298.europe-west4.run.app
    availability:
      - RUNTIME

  # Google's front door adds X-Forwarded-* headers to every request. Angular trusts
  # only -host and -proto by default; any other one makes it play safe and send the
  # page unrendered (browser-only). These are set by Google, not by visitors, and
  # the host is still checked against the list above.
  - variable: NG_TRUST_PROXY_HEADERS
    value: x-forwarded-for,x-forwarded-host,x-forwarded-proto,x-forwarded-port
    availability:
      - RUNTIME

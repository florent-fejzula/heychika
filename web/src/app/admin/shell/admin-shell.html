<div class="shell">
  <header class="top no-print">
    <a class="brand wordmark" routerLink="/admin">Hey Chika</a>
    <div class="who">
      <span class="muted">{{ staff()?.name }}</span>
      <app-lang-picker />
      <button class="btn" type="button" (click)="signOut()">{{ 'admin.shell.signOut' | t }}</button>
    </div>
  </header>

  <nav class="nav no-print" [attr.aria-label]="'admin.shell.nav' | t">
    @for (item of nav; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        [class.also-active]="alsoActive(item)"
        [routerLinkActiveOptions]="{ exact: !!item.exact }"
        ariaCurrentWhenActive="page"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="item.icon" /></svg>
        <span>{{ item.label | t }}</span>
      </a>
    }
  </nav>

  <main class="content">
    <router-outlet />
  </main>
</div>

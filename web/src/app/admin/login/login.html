<div class="lang"><app-lang-picker /></div>

<main class="login">
  <h1 class="brand wordmark">Hey Chika</h1>
  <p class="muted">{{ 'admin.login.subtitle' | t }}</p>

  @if (!configured) {
    <p class="notice notice-error">
      {{ 'admin.login.notConfigured' | t }} <code>src/environments</code>
    </p>
  }

  <form class="card stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="field">
      <span>{{ 'admin.login.email' | t }}</span>
      <input type="email" formControlName="email" autocomplete="username" inputmode="email" />
    </label>

    <label class="field">
      <span>{{ 'admin.login.password' | t }}</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (error(); as message) {
      <p class="notice notice-error" role="alert">{{ message | t }}</p>
    }

    <button class="btn btn-primary btn-block" type="submit" [disabled]="busy()">
      {{ (busy() ? 'admin.login.signingIn' : 'admin.login.signIn') | t }}
    </button>
  </form>
</main>
